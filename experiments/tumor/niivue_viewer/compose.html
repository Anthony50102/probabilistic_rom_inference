<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <title>NiiVue publication figure</title>
    <style>
      /* CSS px are laid out at 100 per inch; render-figure captures at manifest.figure.scale. */
      html, body { margin: 0; background: #000; }
      #figure { box-sizing: border-box; padding: 8px 8px 5px 3px; background: #000; color: #e4e4e4;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .title { margin: 0 0 4px 21px; font-size: 12px; text-align: center; color: #f0f0f0; }
      .grid { display: grid; grid-template-columns: 18px repeat(var(--columns), 1fr); gap: 3px; }
      .column { padding-bottom: 1px; font-size: 11.5px; text-align: center; }
      .row { writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; font-size: 11.5px;
        line-height: 1.15; text-align: center; white-space: pre-line; }
      .cell { position: relative; outline: 1px solid #2a2a2a; }
      .cell canvas { display: block; width: 100%; }
      .error { position: absolute; right: 4px; bottom: 3px; font-size: 11px; color: #fff;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 0 4px #000; }
      .corner { position: absolute; left: 4px; top: 3px; font-size: 8.5px; letter-spacing: .4px; color: #c8c8c8;
        text-transform: uppercase; text-shadow: 0 0 2px #000, 0 0 3px #000; }
      .scalebar { position: absolute; left: 5px; bottom: 5px; height: 0; border-top: 1.5px solid #fff;
        box-shadow: 0 0 2px #000; }
      .scalebar span { position: absolute; left: 0; bottom: 2px; font-size: 9px; white-space: nowrap;
        text-shadow: 0 0 2px #000, 0 0 3px #000; }
      .colorbar { margin: 7px 0 0 21px; }
      .bar { position: relative; height: 7px; outline: 1px solid #6a6a6a; }
      .bar canvas { display: block; width: 100%; height: 100%; }
      .ticks { position: relative; height: 13px; font-size: 9.5px; font-variant-numeric: tabular-nums; }
      .ticks span { position: absolute; top: 3px; transform: translateX(-50%); }
      .ticks span::before { content: ""; position: absolute; left: 50%; top: -3px; height: 3px;
        border-left: 1px solid #9a9a9a; }
      .label { margin-top: 1px; font-size: 10.5px; text-align: center; }
    </style>
  </head>
  <body>
    <!-- Layout target for scripts/render-figure.js: the rendered panels of data/figure/manifest.json. -->
    <div id="figure"></div>
    <p id="status" role="status" hidden>Loading figure panels…</p>
    <script type="module" src="/src/compose.js"></script>
  </body>
</html>
